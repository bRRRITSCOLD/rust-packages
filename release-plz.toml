# Git-only releases: one lockstep workspace version, one repo-wide `v<version>` tag,
# one root CHANGELOG.md. Nothing is published to crates.io.
[workspace]
git_only = true
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
publish = false
semver_check = false
release_always = false
changelog_update = false

# Every release entry states the GPUI pin and the core-react pin under its heading. The GitHub
# release copies its body from that entry, so it states them too. The command gets the rendered
# entry on stdin; a non-zero exit fails the release PR rather than dropping the pins.
[changelog]
postprocessors = [
  { pattern = '(?m)^## \[\d', replace_command = "cargo xtask release-notes" },
]

[[package]]
name = "brrritscold-core-gpui"
version_group = "all"
changelog_update = true
changelog_path = "CHANGELOG.md"
# Includes only from the second release on: release-plz 0.4.3 adds `changelog_include` commits
# only to a package with a previous release (tag `v<version>`), so the first release (v0.1.0)
# dropped the tokens-only commit and its entry was backfilled by hand.
changelog_include = ["brrritscold-core-gpui-tokens"]

[[package]]
name = "brrritscold-core-gpui-tokens"
version_group = "all"
# Tagged by core-gpui's shared `v<version>` tag; it creates no tag or release of its own.
git_tag_enable = false
git_release_enable = false

[[package]]
name = "xtask"
release = false

[[package]]
name = "brrritscold-core-gpui-gallery"
release = false
