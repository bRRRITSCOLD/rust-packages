[package]
name = "brrritscold-core-gpui-tokens"
description = "Design tokens for core-gpui, generated from core-react's tokens.json."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The core-react pin: tokens.json and library.snapshot.json are vendored from this exact
# npm version by `cargo xtask tokens update`. Don't edit by hand.
[package.metadata.core-react]
version = "1.4.0"
tokens-sha256 = "794dd57761ac728c44c9a44b2a3fd2647fcf4ea8bdb28a2b1fd85a7a6a919050"
snapshot-sha256 = "17fc5aacc0f5d11cc625fecfecf36f49806571289c4d4c12651e0817446521df"
lucide = "1.68.0"

# The drift checker pin: `cargo xtask drift` runs `design-drift check` from this exact
# @brrritscold/design-core-node. The rules live in @brrritscold/design-core-js, which
# design-core-node takes by a caret range, so it's pinned too. Move both with the core-react
# pin, so the checker understands the snapshot's `schemaVersion`.
[package.metadata.design-core-node]
version = "0.1.2"
design-core-js = "0.1.2"

[dependencies]
gpui.workspace = true

[lints]
workspace = true
