[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bRRRITSCOLD/rust-packages"
publish = false

[workspace.dependencies]
# Workspace crates. Apps pin every brrritscold-* crate to the same `v<version>` tag.
brrritscold-core-gpui = { path = "crates/core-gpui" }
brrritscold-core-gpui-tokens = { path = "crates/core-gpui-tokens" }

# The GPUI pin: the gpui-kit version (`gpui-base`). Every gpui-pre* line below is
# derived from gpui-base's own `=` requirements and is never chosen on its own.
# `cargo xtask gpui update` rewrites this block.
gpui-base = "=0.9.1"
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-macros = { package = "gpui-pre-macros", version = "=0.3.12" }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12" }
gpui-reqwest-client = { package = "gpui-pre-reqwest-client", version = "=0.3.12" }
gpui-sum-tree = { package = "gpui-pre-sum-tree", version = "=0.3.12" }

anyhow = "1"
# Calendar dates: the version gpui-base already pulls in, named by core-gpui's public API.
chrono = { version = "0.4", default-features = false }
thiserror = "2"
# Variant enums: `EnumIter` for the gallery registry, kebab-case strings = Penpot values.
strum = { version = "0.28", features = ["derive"] }

# Gallery only: writes the headless captures (gpui already pulls `image` in with png).
image = { version = "0.25", default-features = false, features = ["png"] }

# xtask only.
flate2 = "1.1.11"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tar = "0.4.46"
toml_edit = "0.25.19"
ureq = { version = "3.5.1", features = ["json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

